{% if form.non_field_errors %}
<div class="form-errors" role="alert">
    {% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
</div>
{% endif %}
{% for field in form %}
<div class="field">
    <label class="field__label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<p class="field__help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
    <p class="field__error" id="{{ field.auto_id }}_error">{% for error in field.errors %}{{ error }} {% endfor %}</p>
</div>
{% endfor %}
