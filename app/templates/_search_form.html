<form class="search__form" role="search" method="get" action="{% url 'search' %}">
    <svg class="search__icon" width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
        <circle cx="17" cy="17" r="12"/>
        <path d="M26 26l9 9" stroke-linecap="round"/>
    </svg>
    <label class="visually-hidden" for="search-q">Поиск питомца</label>
    <input class="search__input" id="search-q" type="search" name="q" value="{{ q|default:'' }}" placeholder="Поиск...">
    <button class="search__submit" type="submit">Найти</button>
</form>
