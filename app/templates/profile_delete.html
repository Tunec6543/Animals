{% extends 'base.html' %}

{% block title %}Удаление профиля — Лапа помощи{% endblock %}

{% block content %}
<section class="auth" aria-labelledby="delete-title">
    <h1 class="auth__title" id="delete-title">Удалить профиль?</h1>
    <p>Профиль «{{ user.username }}», заявки, записи на прогулки и взносы будут удалены без возможности восстановления.</p>
    <form class="auth__form" method="post" action="{% url 'profile_delete' %}">
        {% csrf_token %}
        <button class="btn btn--black" type="submit">Да, удалить</button>
        <a class="btn btn--green" href="{% url 'profile' %}">Отмена</a>
    </form>
</section>
{% endblock %}
