{% extends 'base.html' %}

{% block title %}Страница не найдена — Лапа помощи{% endblock %}

{% block content %}
<section class="page-block page-block--center" aria-labelledby="error-title">
    <h1 class="page-block__code" id="error-title">404</h1>
    <p class="page-block__text">Такой страницы нет: возможно, ссылка устарела или питомца уже забрали домой. Вернитесь на главную или найдите питомца через поиск.</p>
    <a class="btn btn--green" href="{% url 'index' %}">На главную</a>
    <a class="btn btn--black" href="{% url 'search' %}">Поиск питомца</a>
</section>
{% endblock %}
