<article class="pet-card">
    <a class="pet-card__link" href="{% url 'pet_detail' pet.pk %}">
        {% if pet.photo %}
        <img class="pet-card__photo" src="{{ pet.photo.url }}" alt="{{ pet.name }}, {{ pet.get_species_display|lower }}" width="220" height="254" loading="lazy">
        {% endif %}
        <div class="pet-card__bar">
            <h3 class="pet-card__name">{{ pet.name }}</h3>
            <p class="pet-card__meta">{{ pet.get_species_display }}{% if pet.breed %}, {{ pet.breed|truncatechars:16 }}{% endif %}</p>
            <p class="pet-card__meta">{{ pet.get_status_display }}</p>
        </div>
    </a>
    <button class="pet-card__fav" type="button" data-fav="{{ pet.pk }}" aria-pressed="false" aria-label="Избранное: {{ pet.name }}">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3 4.5 6.7 4.5c2 0 3.7 1 5.3 3 1.6-2 3.3-3 5.3-3 3.7 0 5.8 3.8 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
    </button>
</article>
